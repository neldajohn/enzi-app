databases:
  - name: enzi-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: enzi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: enzi-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: RESEND_API_KEY
        sync: false
