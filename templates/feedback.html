<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enzi — Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page page-with-bottom-nav">
    {% include '_header.html' %}

    <div class="list-header">
      <h2>{{ t('feedback_title') }}</h2>
    </div>
    <p class="subtitle">{{ t('feedback_subtitle') }}</p>

    {% if error %}
      <p class="message message-error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('feedback') }}" class="card">
      <label for="business_name_display">{{ t('label_business') }}</label>
      <input type="text" id="business_name_display" value="{{ business_name|titlecase }}" disabled>

      <label for="user_name_display">{{ t('label_your_name') }}</label>
      <input type="text" id="user_name_display" value="{{ user_name|titlecase }}" disabled>

      <label for="message">{{ t('label_your_feedback') }}</label>
      <textarea id="message" name="message" rows="6" placeholder="{{ t('ph_feedback_message') }}" required autofocus>{{ message or '' }}</textarea>

      <label for="contact_email">{{ t('label_your_email') }} <span class="optional">{{ t('contact_required_note') }}</span></label>
      <input type="email" id="contact_email" name="contact_email" value="{{ contact_email or '' }}" placeholder="e.g. amina@example.com">

      <label for="contact_whatsapp">{{ t('label_whatsapp') }} <span class="optional">{{ t('contact_required_note') }}</span></label>
      <input type="tel" id="contact_whatsapp" name="contact_whatsapp" value="{{ contact_whatsapp or '' }}" placeholder="{{ t('ph_whatsapp') }}">

      <button type="submit">{{ t('send_feedback_btn') }}</button>
    </form>

    <a href="{{ url_for('index') }}" class="switch-link">{{ t('cancel') }}</a>
  </main>
  {% include '_bottom_nav.html' %}
  <a href="javascript:void(0)" class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">↑ Top</a>
</body>
</html>
