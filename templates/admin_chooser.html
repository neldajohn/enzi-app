<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enzi — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page page-with-bottom-nav">
    {% include '_header.html' %}

    <a href="{{ url_for('index') }}" class="switch-link arrow-link back-link">&larr; {{ t('back') }}</a>

    <div class="list-header">
      <h2>{{ t('admin_title') }}</h2>
    </div>

    <div class="admin-chooser-grid">
      <a href="{{ url_for('business_admin') }}" class="admin-chooser-btn">{{ t('choice_business') }}</a>
      <a href="{{ url_for('personal_admin') }}" class="admin-chooser-btn">{{ t('choice_personal') }}</a>
    </div>
  </main>
  {% include '_bottom_nav.html' %}
  <a href="javascript:void(0)" class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">↑ Top</a>
</body>
</html>
