{% if theme %}
<style>:root { --brand-bg: {{ theme.bg }}; --brand-solid: {{ theme.solid }}; }</style>
{% endif %}
<header class="topbar">
  <div class="header-brand">
    {% if business %}
      {% if business.logo_url %}
        <img src="{{ business.logo_url }}" alt="" class="header-logo">
      {% else %}
        <div class="header-logo header-logo-placeholder">{{ (business.business_name or '?')|first|upper }}</div>
      {% endif %}
      <div class="header-business-name">{{ business.business_name|titlecase }}</div>
    {% else %}
      <h1>{{ t('app_name') }}</h1>
    {% endif %}
  </div>
  <div class="header-right">
    <div class="header-links">
      <a href="{{ url_for('business_admin') }}" class="switch-link">{{ t('admin') }}</a>
      <a href="{{ url_for('feedback') }}" class="switch-link">{{ t('send_feedback') }}</a>
    </div>
  </div>
</header>
