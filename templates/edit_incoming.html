<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enzi — Edit Incoming Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page page-with-bottom-nav">
    {% include '_header.html' %}

    <div class="list-header">
      <h2>{{ t('edit_incoming_title') }}</h2>
    </div>
    <p class="subtitle">{{ incoming.item_name }}{% if incoming.item_type %} — {{ incoming.item_type }}{% endif %}</p>

    {% if error %}
      <p class="message message-error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('edit_incoming', incoming_id=incoming.id) }}" class="card">
      <label for="quantity">{{ t('label_quantity') }}</label>
      <input type="number" id="quantity" name="quantity" value="{{ incoming.quantity }}" min="0" inputmode="numeric" required>

      <label for="price_per_unit">{{ t('label_price_per_unit') }}</label>
      <input type="number" id="price_per_unit" name="price_per_unit" value="{{ incoming.price_per_unit }}" min="0" step="0.01" inputmode="decimal" required>

      <label for="location">{{ t('label_location') }} <span class="optional">{{ t('optional') }}</span></label>
      <input type="text" id="location" name="location" value="{{ incoming.location or '' }}">

      <label for="expected_date">{{ t('label_expected_arrival') }} <span class="optional">{{ t('optional') }}</span></label>
      <input type="date" id="expected_date" name="expected_date" value="{{ incoming.expected_date or '' }}">

      <button type="submit">{{ t('save_changes') }}</button>
    </form>

    <a href="{{ url_for('items_tab') }}" class="switch-link">{{ t('cancel') }}</a>
  </main>
  {% include '_bottom_nav.html' %}
  <a href="javascript:void(0)" class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">↑ Top</a>
</body>
</html>
