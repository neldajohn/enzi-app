<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enzi — Edit Item</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='photo-input.js') }}" defer></script>
</head>
<body>
  <main class="page page-with-bottom-nav">
    {% include '_header.html' %}

    <div class="list-header">
      <h2>{{ t('edit_item_title') }}</h2>
    </div>
    <p class="subtitle">{{ t('edit_item_subtitle') }}</p>

    {% if error %}
      <p class="message message-error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('edit_item', item_id=item.id) }}" class="card" enctype="multipart/form-data">
      <label for="item_type">{{ t('label_item_type') }} <span class="optional">{{ t('optional') }}</span></label>
      <input type="text" id="item_type" name="item_type" value="{{ item.item_type or '' }}" maxlength="150" autofocus>

      <label for="item_brand">{{ t('label_brand') }} <span class="optional">{{ t('optional') }}</span></label>
      <input type="text" id="item_brand" name="item_brand" value="{{ item.item_brand or '' }}" maxlength="150">

      <label for="item_name">{{ t('label_item_name') }}</label>
      <input type="text" id="item_name" name="item_name" value="{{ item.item_name }}" maxlength="150" required>

      <label for="item_color">{{ t('label_item_color') }} <span class="optional">{{ t('optional') }}</span></label>
      <input type="text" id="item_color" name="item_color" value="{{ item.item_color or '' }}" maxlength="150">

      <label for="item_size">{{ t('label_size') }} <span class="optional">{{ t('optional') }}</span></label>
      <input type="text" id="item_size" name="item_size" value="{{ item.item_size or '' }}" maxlength="150">

      <label for="item_code">{{ t('label_item_code') }} <span class="optional">{{ t('optional') }}</span></label>
      <input type="text" id="item_code" name="item_code" value="{{ item.item_code or '' }}" maxlength="150">

      <label for="location">{{ t('label_location') }}</label>
      <input type="text" id="location" name="location" value="{{ item.location or '' }}" maxlength="150">

      <label for="price_per_unit">{{ t('label_price_per_unit') }}</label>
      <input type="number" id="price_per_unit" name="price_per_unit" value="{{ item.price_per_unit }}" min="0" max="500000000" step="0.01" inputmode="decimal">

      <label for="notes">{{ t('label_notes') }} <span class="optional">{{ t('optional') }}</span></label>
      <textarea id="notes" name="notes" rows="4" placeholder="{{ t('ph_notes_item') }}" maxlength="1000">{{ item.notes or '' }}</textarea>

      <label for="photo">{{ t('label_photo') }} <span class="optional">{{ t('optional') }}</span></label>
      {% if item.photo_url %}
        <img src="{{ item.photo_url }}" alt="{{ item.item_name }}" class="item-photo">
      {% endif %}
      <input type="file" id="photo" name="photo" accept="image/*" class="photo-file-input" hidden onchange="showPhotoFilename('photo')">
      <div class="photo-buttons">
        <button type="button" class="qty-btn" onclick="triggerPhotoInput('photo')">{{ t('add_photo') if not item.photo_url else t('change_photo') }}</button>
      </div>
      <span id="photo-filename-photo" class="item-code"></span>

      <button type="submit">{{ t('save_changes') }}</button>
    </form>

    <a href="{{ url_for('sell_tab') }}" class="switch-link">{{ t('cancel') }}</a>
  </main>
  {% include '_bottom_nav.html' %}
  <a href="javascript:void(0)" class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">↑ Top</a>
</body>
</html>
