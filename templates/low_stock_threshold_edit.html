<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enzi — Low Stock Alert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page page-with-bottom-nav">
    {% include '_header.html' %}

    <div class="list-header">
      <h2>{{ t('section_low_stock') }}</h2>
    </div>
    <p class="subtitle">{{ t('low_stock_settings_subtitle') }}</p>

    <form method="POST" action="{{ url_for('edit_low_stock_threshold') }}" class="card">
      <label for="low_stock_threshold">{{ t('label_low_stock_threshold') }}</label>
      <input type="number" id="low_stock_threshold" name="low_stock_threshold" value="{{ business.low_stock_threshold }}" min="0" max="100000" inputmode="numeric" autofocus>
      <span class="hint">{{ t('low_stock_threshold_hint') }}</span>

      <div class="actions-row">
        <a href="{{ url_for('business_admin') }}" class="qty-btn">{{ t('cancel') }}</a>
        <button type="submit" class="qty-btn qty-btn-primary">{{ t('save_changes') }}</button>
      </div>
    </form>
  </main>
  {% include '_bottom_nav.html' %}
  <a href="javascript:void(0)" class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">↑ Top</a>
</body>
</html>
